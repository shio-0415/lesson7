<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>計算機</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #1a1a2e;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Sans JP', sans-serif;
      padding: 40px 0;
      box-sizing: border-box;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      padding: 40px;
      width: 320px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a2e;
      margin: 0 0 24px;
    }

    .inputs {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      font-size: 20px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      text-align: center;
      outline: none;
      transition: border-color 0.3s;
      box-sizing: border-box;
    }

    input[type="number"]:focus {
      border-color: #4fc3f7;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    button {
      flex: 1;
      padding: 14px 0;
      font-size: 20px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover {
      opacity: 0.8;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .btn-plus  { background-color: #2196f3; }
    .btn-minus { background-color: #f44336; }
    .btn-times { background-color: #4caf50; }
    .btn-div   { background-color: #ff9800; }

    /* ↓ 「前の結果を使う」ボタン */
    .btn-use-result {
      width: 100%;
      background-color: #7c4dff;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 0;
      border-radius: 10px;
      margin-bottom: 16px;
      display: none; /* 最初は非表示。計算後に表示する */
    }

    .result-box {
      background: #f5f5f5;
      border-radius: 12px;
      padding: 16px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeIn 0.4s ease-out;
    }

    #formula {
      font-size: 14px;
      color: #999;
      margin: 0 0 6px;
      min-height: 20px;
    }

    #result {
      font-size: 48px;
      font-weight: 700;
      color: #1a1a2e;
      margin: 0;
      min-height: 60px;
    }

    #result.error {
      color: #f44336;
      font-size: 20px;
    }

    .history-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      padding: 24px 40px;
      width: 320px;
      margin-top: 20px;
      box-sizing: border-box;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .history-header h2 {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a2e;
      margin: 0;
    }

    .btn-clear {
      background: #eee;
      color: #888;
      font-size: 12px;
      font-weight: 400;
      padding: 6px 12px;
      border-radius: 8px;
      flex: none;
    }

    .btn-clear:hover {
      background: #f44336;
      color: #fff;
    }

    .history-item {
      font-size: 15px;
      color: #555;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
      text-align: left;
      animation: fadeIn 0.4s ease-out;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-empty {
      font-size: 13px;
      color: #bbb;
      text-align: center;
      padding: 8px 0;
    }

    /* ↓ Enterキーのヒント表示 */
    .enter-hint {
      font-size: 11px;
      color: #bbb;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>計算機</h1>

    <div class="inputs">
      <input type="number" id="num1" value="0">
      <input type="number" id="num2" value="0">
    </div>

    <div class="buttons">
      <button class="btn-plus"  onclick="calculate('+')">+</button>
      <button class="btn-minus" onclick="calculate('-')">−</button>
      <button class="btn-times" onclick="calculate('×')">×</button>
      <button class="btn-div"   onclick="calculate('÷')">÷</button>
    </div>

    <!-- ↓ 計算後に表示される「前の結果を使う」ボタン -->
    <button class="btn-use-result" id="btn-use-result" onclick="useResult()">
      ↩ 前の結果を左の入力欄にセット
    </button>

    <div class="result-box">
      <p id="formula"></p>
      <p id="result">—</p>
    </div>

    <p class="enter-hint">💡 Enterキーでも計算できます</p>
  </div>

  <div class="history-card">
    <div class="history-header">
      <h2>計算履歴</h2>
      <button class="btn-clear" onclick="clearHistory()">履歴をクリア</button>
    </div>
    <div id="history-list">
      <p class="history-empty">履歴はまだありません</p>
    </div>
  </div>

  <script>
    let history = [];
    let lastResult = null;     // 直前の計算結果を保存する
    let lastOperator = null;   // Enterで再計算するために演算子を保存する

    // ── Enterキーで計算する ──────────────────────────────
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && lastOperator !== null) {
        calculate(lastOperator);
      }
    });

    function calculate(operator) {
      lastOperator = operator; // 押された演算子を記録しておく

      let a = Number(document.getElementById('num1').value);
      let b = Number(document.getElementById('num2').value);
      let result;
      let isError = false;

      if (operator === '+') {
        result = a + b;
      } else if (operator === '-') {
        result = a - b;
      } else if (operator === '×') {
        result = a * b;
      } else if (operator === '÷') {
        if (b === 0) {
          result = 'エラー: 0では割れません';
          isError = true;
        } else {
          result = a / b;
        }
      }

      // ── 小数点第3位で四捨五入 ────────────────────────
      // isError でなく、かつ小数が含まれる場合のみ丸める
      if (!isError && !Number.isInteger(result)) {
        result = Math.round(result * 1000) / 1000;
      }

      // ── 計算式を表示 ──────────────────────────────────
      const formulaEl = document.getElementById('formula');
      formulaEl.textContent = isError ? '' : `${a} ${operator} ${b} =`;

      // ── 結果をフェードインで表示 ──────────────────────
      const resultEl = document.getElementById('result');
      resultEl.classList.remove('fade-in', 'error');
      requestAnimationFrame(() => {
        resultEl.textContent = result;
        resultEl.classList.add('fade-in');
        if (isError) resultEl.classList.add('error');
      });

      // ── エラーでなければ後処理 ────────────────────────
      if (!isError) {
        lastResult = result; // 結果を保存

        // 「前の結果を使う」ボタンを表示する
        document.getElementById('btn-use-result').style.display = 'block';

        // 履歴に追加
        const entry = `${a} ${operator} ${b} = ${result}`;
        history.unshift(entry);
        if (history.length > 5) history.pop();
        renderHistory();
      }
    }

    // ── 前の結果を左の入力欄にセットする ────────────────
    function useResult() {
      if (lastResult === null) return;
      document.getElementById('num1').value = lastResult;
    }

    function renderHistory() {
      const listEl = document.getElementById('history-list');
      if (history.length === 0) {
        listEl.innerHTML = '<p class="history-empty">履歴はまだありません</p>';
        return;
      }
      listEl.innerHTML = history
        .map(entry => `<div class="history-item">${entry}</div>`)
        .join('');
    }

    function clearHistory() {
      history = [];
      renderHistory();
    }
  </script>

</body>
</html>
